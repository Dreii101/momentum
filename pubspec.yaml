name: momentum
description: Private offline productivity workspace for Android and Windows.
publish_to: none
version: 1.0.0+2
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.2
  path: 1.9.1
  path_provider: 2.1.6
  file_picker: 13.1.0
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  crypto: 3.0.7
  sqlite3: 3.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2
  msix: 3.18.0
flutter:
  uses-material-design: true
msix_config:
  display_name: Momentum
  publisher_display_name: Momentum Private
  identity_name: dev.momentum.private
  publisher: CN=MomentumPrivate
  msix_version: 1.0.0.2
  logo_path: assets/identity/momentum.png
  architecture: x64
  os_min_version: 10.0.19041.0
  capabilities: ''
  sign_msix: false
  install_certificate: false
  toast_activator:
    clsid: d8a4762d-5267-4eda-9319-821b58901837
    arguments: -ToastActivated
    display_name: Momentum
